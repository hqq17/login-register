<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 校园系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container register-container">
        <!-- 左侧：学校信息区域 -->
        <div class="left-section">
            <div class="school-info">
                <img src="images/school_logo.png" >
                <h2 class="school-name"ondblclick="openSchoolWebsite()">兰州理工大学</h2>
                <p class="student-info">
                    学号：230162401017<br>
                    姓名：何倩倩
                </p>
            </div>
            <div class="school-image">
                <img src="images/school_view2.jpg" >
                <p class="image-caption"></p>
            </div>
        </div>

        <!-- 右侧：注册表单 -->
        <div class="right-section">
            <div class="register-card">
                <h1 class="register-title">创建账号</h1>
                <p class="register-subtitle">加入我们，开启精彩校园生活</p>

                <form id="registerForm">
                    <div class="input-group">
                        <label for="regUsername">用户名</label>
                        <input type="text" id="regUsername" name="username" 
                               placeholder="请输入用户名（4-20位）" required>
                        <span class="error-message" id="usernameError"></span>
                    </div>

                    <div class="input-group">
                        <label for="regEmail">邮箱</label>
                        <input type="email" id="regEmail" name="email" 
                               placeholder="请输入邮箱地址" required>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="input-group">
                        <label for="regPassword">密码</label>
                        <input type="password" id="regPassword" name="password" 
                               placeholder="请输入密码（6-20位）" required>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">确认密码</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" 
                               placeholder="请再次输入密码" required>
                        <span class="error-message" id="confirmError"></span>
                    </div>

                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" id="agreeTerms" required> 
                            我已阅读并同意《用户协议》和《隐私政策》
                        </label>
                    </div>

                    <button type="submit" class="register-btn">立即注册</button>
                </form>

                <div class="login-link">
                    已有账号？<a href="index.html">去登录</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
